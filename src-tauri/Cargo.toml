[package]
name = "coder"
version = "0.1.0"
description = "AI Assistant Desktop Application"
authors = ["Coder Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "coder"

[lib]
name = "coder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

# NLP dependencies
regex = "1"
chrono = { version = "0.4", features = ["serde"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# HTTP client for LLM APIs
reqwest = { version = "0.12", features = ["json", "stream"] }

# Async streaming support
futures = "0.3"
async-stream = "0.3"

# Diff generation for file write previews
similar = "2"

# Code parsing (for Phase 6 - Code Understanding)
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-python = "0.21"
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
