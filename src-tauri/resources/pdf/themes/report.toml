# Default "report" theme for the PDF renderer.
#
# This file is the single source of truth for every visual knob the
# renderer reads. Code must not bake equivalent constants inline — the
# sweep test in `printpdf_renderer.rs` fails if it finds numeric literals
# that belong here.

[typography]
body_font_size_pt = 11.0
heading_font_size_pt = 18.0
line_leading = 1.3

[palette.text]
r = 0.05
g = 0.05
b = 0.05

[palette.heading]
r = 0.0
g = 0.0
b = 0.0

[palette.code_bg]
r = 0.96
g = 0.96
b = 0.97

[palette.code_text]
r = 0.12
g = 0.12
b = 0.15

[palette.callout_bg]
r = 0.93
g = 0.95
b = 0.99

[palette.callout_border]
r = 0.28
g = 0.44
b = 0.78

[spacing]
block_gap = 0.4
list_indent_mm = 6.0
block_padding_mm = 2.5

[page_defaults]
margin_mm = 20.0

[decorations]
# Tokens: {title} {page} {total_pages} {section}
# Either side can be omitted to drop that strip.
header = "{title}"
footer = "Page {page} of {total_pages}"
suppress_on_first_page = true
font_size_pt = 9.0
margin_mm = 10.0

[fonts]
regular = "LiberationSans-Regular.ttf"
bold = "LiberationSans-Bold.ttf"
italic = "LiberationSans-Italic.ttf"
mono = "LiberationSans-Regular.ttf"
fallbacks = ["DejaVuSans.ttf"]
