# Default "report" theme for the PDF renderer.
#
# This file is the single source of truth for every visual knob the
# renderer reads. Code must not bake equivalent constants inline — the
# sweep test in `printpdf_renderer.rs` fails if it finds numeric literals
# that belong here.

[typography]
body_font_size_pt = 11.0
heading_font_size_pt = 18.0
line_leading = 1.3

[palette.text]
r = 0.05
g = 0.05
b = 0.05

[palette.heading]
r = 0.0
g = 0.0
b = 0.0

[spacing]
block_gap = 0.4

[page_defaults]
margin_mm = 20.0

[fonts]
regular = "LiberationSans-Regular.ttf"
bold = "LiberationSans-Bold.ttf"
italic = "LiberationSans-Italic.ttf"
mono = "LiberationSans-Regular.ttf"
fallbacks = ["DejaVuSans.ttf"]
