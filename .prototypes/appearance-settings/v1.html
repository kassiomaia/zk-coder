<!doctype html>
<html lang="en" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Coder — Appearance Section Prototype</title>
		<style>
			/* ====================================================================
				 Mirrors design-system.css just enough to make the prototype faithful
				 to what the Settings modal will look like in-app. Real implementation
				 will use the actual CSS modules + design tokens.
				 ==================================================================== */
			:root {
				--font-sans:
					'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				--text-2xs: 0.625rem;
				--text-xs: 0.75rem;
				--text-sm: 0.875rem;
				--text-base: 1rem;
				--text-lg: 1.125rem;
				--font-medium: 500;
				--font-semibold: 600;
				--tracking-wider: 0.05em;
				--space-0-5: 0.125rem;
				--space-1: 0.25rem;
				--space-1-5: 0.375rem;
				--space-2: 0.5rem;
				--space-3: 0.75rem;
				--space-4: 1rem;
				--space-5: 1.25rem;
				--space-6: 1.5rem;
				--space-8: 2rem;
				--space-10: 2.5rem;
				--radius-md: 0.375rem;
				--radius-lg: 0.5rem;
				--transition-fast: 150ms cubic-bezier(0.2, 0, 0, 1);
			}

			[data-theme='light'] {
				--color-bg-base: #f7f6f3;
				--color-bg-primary: #fdfcfa;
				--color-bg-secondary: #f2f1ed;
				--color-bg-tertiary: #eae9e4;
				--color-surface: #fdfcfa;
				--color-surface-hover: #f4f3ef;
				--color-text-primary: #1c1c1a;
				--color-text-secondary: #5a5955;
				--color-text-tertiary: #8a8984;
				--color-text-muted: #b5b4ae;
				--color-border-subtle: #edece6;
				--color-border-primary: #e0dfda;
				--color-border-secondary: #d2d1cb;
				--color-accent-primary: #4b5068;
				--color-accent-primary-muted: rgba(75, 80, 104, 0.08);
				--color-success: #2d9468;
				--swatch-1: #fdfcfa;
				--swatch-2: #f2f1ed;
				--swatch-3: #eae9e4;
				--swatch-4: #4b5068;
			}

			[data-theme='dark'] {
				--color-bg-base: #0b0b0a;
				--color-bg-primary: #0b0b0a;
				--color-bg-secondary: #141413;
				--color-bg-tertiary: #1a1918;
				--color-surface: #141413;
				--color-surface-hover: #1a1918;
				--color-text-primary: #e6e5e0;
				--color-text-secondary: #a3a29a;
				--color-text-tertiary: #73726a;
				--color-text-muted: #545350;
				--color-border-subtle: rgba(255, 252, 245, 0.04);
				--color-border-primary: rgba(255, 252, 245, 0.07);
				--color-border-secondary: rgba(255, 252, 245, 0.1);
				--color-accent-primary: #7a7f96;
				--color-accent-primary-muted: rgba(92, 97, 120, 0.12);
				--color-success: #3d9970;
				--swatch-1: #141413;
				--swatch-2: #1a1918;
				--swatch-3: #201f1e;
				--swatch-4: #7a7f96;
			}

			* {
				box-sizing: border-box;
			}

			body {
				font-family: var(--font-sans);
				background: var(--color-bg-base);
				color: var(--color-text-primary);
				margin: 0;
				padding: var(--space-8);
				min-height: 100vh;
				transition:
					background var(--transition-fast),
					color var(--transition-fast);
			}

			.modal-frame {
				max-width: 720px;
				margin: 0 auto;
				background: var(--color-bg-primary);
				border: 1px solid var(--color-border-subtle);
				border-radius: var(--radius-lg);
				padding: var(--space-8);
			}

			.modal-title {
				font-size: var(--text-lg);
				font-weight: var(--font-semibold);
				margin: 0 0 var(--space-6);
				letter-spacing: -0.01em;
			}

			.section {
				display: flex;
				flex-direction: column;
				gap: var(--space-6);
			}

			.section-header {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding-bottom: var(--space-3);
				border-bottom: 1px solid var(--color-border-subtle);
			}

			.section-title-group {
				display: flex;
				align-items: center;
				gap: var(--space-3);
			}

			.section-icon {
				color: var(--color-text-secondary);
				opacity: 0.8;
				display: flex;
			}

			.section-title {
				font-size: var(--text-sm);
				font-weight: var(--font-semibold);
				color: var(--color-text-primary);
				text-transform: uppercase;
				letter-spacing: var(--tracking-wider);
				margin: 0;
			}

			/* ====================================================================
				 Theme picker — three-card row.
				 Each card shows: a tinted preview composed from the actual tokens
				 of that theme, the theme name, and a one-line description.
				 ==================================================================== */
			.theme-grid {
				display: grid;
				grid-template-columns: repeat(3, 1fr);
				gap: var(--space-4);
			}

			.theme-option {
				position: relative;
				display: flex;
				flex-direction: column;
				gap: var(--space-3);
				padding: var(--space-3);
				background: var(--color-surface);
				border: 1px solid var(--color-border-primary);
				border-radius: var(--radius-md);
				cursor: pointer;
				transition:
					border-color var(--transition-fast),
					background var(--transition-fast),
					box-shadow var(--transition-fast);
				text-align: left;
				font-family: inherit;
			}

			.theme-option:hover {
				background: var(--color-surface-hover);
				border-color: var(--color-border-secondary);
			}

			.theme-option[aria-checked='true'] {
				border-color: var(--color-accent-primary);
				box-shadow: 0 0 0 1px var(--color-accent-primary);
			}

			/* Preview tile uses the swatch tokens that vary per theme.
				 The visual is a mini app frame: header bar, sidebar, content. */
			.preview {
				width: 100%;
				aspect-ratio: 16 / 9;
				border-radius: var(--radius-md);
				overflow: hidden;
				display: grid;
				grid-template-columns: 28% 1fr;
				grid-template-rows: 22% 1fr;
				background: var(--preview-bg);
				border: 1px solid var(--preview-border);
			}

			.preview-light {
				--preview-bg: #f2f1ed;
				--preview-border: #e0dfda;
				--preview-sidebar: #fdfcfa;
				--preview-header: #eae9e4;
				--preview-line-1: #d2d1cb;
				--preview-line-2: #b5b4ae;
				--preview-accent: #4b5068;
			}

			.preview-dark {
				--preview-bg: #0b0b0a;
				--preview-border: rgba(255, 252, 245, 0.07);
				--preview-sidebar: #141413;
				--preview-header: #1a1918;
				--preview-line-1: #3e3d3a;
				--preview-line-2: #545350;
				--preview-accent: #7a7f96;
			}

			.preview-system {
				--preview-bg: linear-gradient(135deg, #f2f1ed 0%, #f2f1ed 50%, #0b0b0a 50%, #0b0b0a 100%);
				--preview-border: rgba(120, 120, 120, 0.18);
				--preview-sidebar: linear-gradient(135deg, #fdfcfa 0%, #fdfcfa 50%, #141413 50%, #141413 100%);
				--preview-header: linear-gradient(135deg, #eae9e4 0%, #eae9e4 50%, #1a1918 50%, #1a1918 100%);
				--preview-line-1: rgba(120, 120, 120, 0.4);
				--preview-line-2: rgba(120, 120, 120, 0.25);
				--preview-accent: #5c6178;
			}

			.preview-header-bar {
				grid-column: 1 / -1;
				background: var(--preview-header);
				display: flex;
				align-items: center;
				gap: 4px;
				padding: 0 6px;
			}
			.preview-dot {
				width: 5px;
				height: 5px;
				border-radius: 50%;
				background: var(--preview-line-2);
				opacity: 0.6;
			}
			.preview-sidebar {
				background: var(--preview-sidebar);
				padding: 6px;
				display: flex;
				flex-direction: column;
				gap: 4px;
			}
			.preview-sidebar-row {
				height: 5px;
				border-radius: 2px;
				background: var(--preview-line-1);
			}
			.preview-sidebar-row.active {
				background: var(--preview-accent);
				opacity: 0.7;
			}
			.preview-content {
				padding: 8px;
				display: flex;
				flex-direction: column;
				gap: 5px;
			}
			.preview-content-row {
				height: 6px;
				border-radius: 3px;
				background: var(--preview-line-2);
			}
			.preview-content-row.short {
				width: 60%;
			}
			.preview-content-row.medium {
				width: 80%;
			}

			.theme-meta {
				display: flex;
				flex-direction: column;
				gap: var(--space-0-5);
				padding: 0 var(--space-1) var(--space-1);
			}

			.theme-name {
				font-size: var(--text-sm);
				font-weight: var(--font-medium);
				color: var(--color-text-primary);
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: var(--space-2);
			}

			.theme-desc {
				font-size: var(--text-xs);
				color: var(--color-text-tertiary);
				line-height: 1.4;
			}

			.check-mark {
				width: 16px;
				height: 16px;
				border-radius: 50%;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				color: white;
				background: var(--color-accent-primary);
				flex-shrink: 0;
				opacity: 0;
				transform: scale(0.6);
				transition:
					opacity 150ms ease,
					transform 200ms cubic-bezier(0.34, 1.56, 0.64, 1);
			}

			.theme-option[aria-checked='true'] .check-mark {
				opacity: 1;
				transform: scale(1);
			}

			.toggle-row {
				margin-top: var(--space-8);
				display: flex;
				gap: var(--space-3);
				justify-content: center;
				font-size: var(--text-xs);
				color: var(--color-text-tertiary);
			}
			.toggle-row button {
				background: var(--color-bg-secondary);
				border: 1px solid var(--color-border-primary);
				padding: var(--space-1) var(--space-3);
				border-radius: var(--radius-md);
				color: var(--color-text-secondary);
				font-family: inherit;
				font-size: var(--text-xs);
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<div class="modal-frame">
			<h2 class="modal-title">Settings — Appearance section preview</h2>

			<section class="section">
				<header class="section-header">
					<div class="section-title-group">
						<span class="section-icon" aria-hidden="true">
							<svg
								width="16"
								height="16"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
								stroke-linejoin="round"
							>
								<circle cx="12" cy="12" r="5"></circle>
								<line x1="12" y1="1" x2="12" y2="3"></line>
								<line x1="12" y1="21" x2="12" y2="23"></line>
								<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
								<line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
								<line x1="1" y1="12" x2="3" y2="12"></line>
								<line x1="21" y1="12" x2="23" y2="12"></line>
							</svg>
						</span>
						<h3 class="section-title">Appearance</h3>
					</div>
				</header>

				<div class="theme-grid" role="radiogroup" aria-label="Theme">
					<button
						type="button"
						role="radio"
						aria-checked="true"
						class="theme-option"
						data-value="light"
					>
						<div class="preview preview-light">
							<div class="preview-header-bar">
								<span class="preview-dot"></span>
								<span class="preview-dot"></span>
								<span class="preview-dot"></span>
							</div>
							<div class="preview-sidebar">
								<div class="preview-sidebar-row active"></div>
								<div class="preview-sidebar-row"></div>
								<div class="preview-sidebar-row"></div>
								<div class="preview-sidebar-row"></div>
							</div>
							<div class="preview-content">
								<div class="preview-content-row medium"></div>
								<div class="preview-content-row"></div>
								<div class="preview-content-row short"></div>
							</div>
						</div>
						<div class="theme-meta">
							<span class="theme-name">
								Light
								<span class="check-mark" aria-hidden="true">
									<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
										<polyline points="20 6 9 17 4 12"></polyline>
									</svg>
								</span>
							</span>
							<span class="theme-desc">Pale, warm surfaces tuned for daylight work.</span>
						</div>
					</button>

					<button
						type="button"
						role="radio"
						aria-checked="false"
						class="theme-option"
						data-value="dark"
					>
						<div class="preview preview-dark">
							<div class="preview-header-bar">
								<span class="preview-dot"></span>
								<span class="preview-dot"></span>
								<span class="preview-dot"></span>
							</div>
							<div class="preview-sidebar">
								<div class="preview-sidebar-row active"></div>
								<div class="preview-sidebar-row"></div>
								<div class="preview-sidebar-row"></div>
								<div class="preview-sidebar-row"></div>
							</div>
							<div class="preview-content">
								<div class="preview-content-row medium"></div>
								<div class="preview-content-row"></div>
								<div class="preview-content-row short"></div>
							</div>
						</div>
						<div class="theme-meta">
							<span class="theme-name">
								Dark
								<span class="check-mark" aria-hidden="true">
									<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
										<polyline points="20 6 9 17 4 12"></polyline>
									</svg>
								</span>
							</span>
							<span class="theme-desc">Warm, low-contrast neutrals for low-light sessions.</span>
						</div>
					</button>

					<button
						type="button"
						role="radio"
						aria-checked="false"
						class="theme-option"
						data-value="system"
					>
						<div class="preview preview-system">
							<div class="preview-header-bar">
								<span class="preview-dot"></span>
								<span class="preview-dot"></span>
								<span class="preview-dot"></span>
							</div>
							<div class="preview-sidebar">
								<div class="preview-sidebar-row active"></div>
								<div class="preview-sidebar-row"></div>
								<div class="preview-sidebar-row"></div>
								<div class="preview-sidebar-row"></div>
							</div>
							<div class="preview-content">
								<div class="preview-content-row medium"></div>
								<div class="preview-content-row"></div>
								<div class="preview-content-row short"></div>
							</div>
						</div>
						<div class="theme-meta">
							<span class="theme-name">
								System
								<span class="check-mark" aria-hidden="true">
									<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
										<polyline points="20 6 9 17 4 12"></polyline>
									</svg>
								</span>
							</span>
							<span class="theme-desc">Match the operating system's color scheme.</span>
						</div>
					</button>
				</div>
			</section>

			<div class="toggle-row">
				<button type="button" onclick="document.documentElement.dataset.theme='light'">
					Preview Light
				</button>
				<button type="button" onclick="document.documentElement.dataset.theme='dark'">
					Preview Dark
				</button>
			</div>
		</div>

		<script>
			// Demonstrate radiogroup interaction
			const opts = document.querySelectorAll('.theme-option');
			opts.forEach((opt) => {
				opt.addEventListener('click', () => {
					opts.forEach((o) => o.setAttribute('aria-checked', 'false'));
					opt.setAttribute('aria-checked', 'true');
				});
			});
		</script>
	</body>
</html>
